name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    # Darwin PyTorch wheels avoid installing the CUDA runtime in baseline CI.
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - name: Save distributions
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
