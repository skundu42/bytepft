name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS wheels keep the CPU test install free of CUDA runtime dependencies.
    runs-on: macos-15
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
